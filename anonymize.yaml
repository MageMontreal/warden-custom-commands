# Warden DB Dump Configuration
#
# Format compatible with Smile gdpr-dump.
# See: https://github.com/Smile-SA/gdpr-dump/blob/next/app/config/templates/magento2.yaml
#
# Table-level directives:
#   skip: true              Exclude entirely (no schema, no data) — for disposable artifacts (_idx, _tmp, _cl, _replica)
#   truncate: true          Keep schema, exclude data — for sessions, cache, logs, index base tables
#   group: sales            Excluded by default, included with -o
#   group: customer         Excluded by default, included with -c
#
# Converter types (for anonymization):
#   randomizeEmail          SHA2 hash + @warden.test (consistent across tables)
#   randomizeText           Inferred from column name (firstname→Anon, lastname→Customer, etc.)
#   randomizeNumber         '0000000000'
#   setNull                 NULL
#   setValue                Literal value (requires parameters.value)
#   setPassword             Pre-computed Magento SHA-256 hash for password123
#   anonymizeDate           NULL
#   anonymizeDateTime       NULL
#   faker                   Supports parameters.formatter: ipv4 → '127.0.0.1'
#   hashValue               SHA2 hash (12 hex chars) — deterministic, identical values stay identical
#   jsonMethodTitle         Keep only method_title key in JSON, discard everything else
#
# Project overrides: create .warden/anonymize.yaml in your project root.
# Files are merged — the project file adds new tables and extends existing ones.

